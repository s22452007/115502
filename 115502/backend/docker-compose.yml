# 一鍵啟動後端：docker compose up -d --build
# 兩個服務共用同一個映像；DB 與照片用 volume 掛到容器外，確保重建容器資料不遺失。

services:
  # 主 API（手機 App 連這個）
  api:
    build: .
    image: jlens-backend            # 建好的映像命名，讓 admin 直接重用、不用再 build 一次
    command: python app.py
    ports:
      - "5050:5050"
    env_file:
      - .env                        # 把 GEMINI 金鑰等環境變數注入容器
    volumes:
      # 開發便利：把後端原始碼 bind-mount 進容器，修改立刻生效（開發時啟用）
      - ./:/app
      - ./instance:/app/instance          # SQLite 資料庫持久化
      - ./static/photos:/app/static/photos # 使用者上傳照片持久化
    restart: unless-stopped

  # 後台管理（管理員網頁後台）
  admin:
    image: jlens-backend            # 重用 api 建好的映像
    command: python admin_app.py
    depends_on:
      - api                         # 等 api 先把映像 build 出來
    ports:
      - "5001:5001"
    env_file:
      - .env
    volumes:
      - ./instance:/app/instance          # 與 api 共用同一個資料庫檔
      - ./static/photos:/app/static/photos
    restart: unless-stopped

  # Cloudflare 通道（對外公開網址）
  #   ★ 預設不啟動 ★ —— 只有加上 --profile tunnel 才會跑，避免本機開發時把後端露出去。
  #   啟動：   docker compose --profile tunnel up -d
  #   看網址： docker compose logs cloudflared   （找 trycloudflare.com 那行）
  cloudflared:
    image: cloudflare/cloudflared:latest
    # 啟動方式（選其一）：
    # 1) 使用本機憑證檔（推薦長期運行）：在 Cloudflare 建立 tunnel 並把憑證放到 ./cloudflared 資料夾
    #    然後用 --profile tunnel 啟動：
    #      docker compose --profile tunnel up -d cloudflared
    #    此模式下 container 會自動用憑證連線到 Cloudflare
    # 2) 或使用短期/自動 token（CI/一次性）：在 .env 設定 TUNNEL_TOKEN，container 以 token 啟動

    # 建議命令：以 token 啟動時會參考 .env（裡面放 TUNNEL_TOKEN）
    command: tunnel run --token ${TUNNEL_TOKEN} --url http://api:5050
    depends_on:
      - api
    env_file:
      - .env
    # 若你使用憑證檔案方式，將 ./cloudflared 掛到容器內的預設位置：
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared:ro
    profiles:
      - tunnel                              # 歸到 tunnel profile，預設不啟動
    restart: unless-stopped
