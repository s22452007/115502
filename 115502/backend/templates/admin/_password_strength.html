<!-- 密碼強度條：自動掛在 name="new_password" 或 name="password" 的欄位下方。
     規則與 utils/password_policy.py、App 的 password_policy.dart 相同；
     後台帳號（管理者、老師）至少要「中」，真正的檢查在後端，這裡只是即時提示。 -->
<style>
  .pw-meter { margin-top: 8px; font-size: 13px; }
  .pw-meter .pw-bars { display: flex; gap: 4px; align-items: center; }
  .pw-meter .pw-bar { flex: 1; height: 6px; border-radius: 3px; background: #e9ecef; }
  .pw-meter .pw-label { margin-left: 8px; font-weight: 700; white-space: nowrap; }
  .pw-meter .pw-warn { color: #d9534f; margin-top: 4px; }
  .pw-meter ul { list-style: none; padding: 0; margin: 6px 0 0; }
  .pw-meter li { color: #adb5bd; line-height: 1.6; }
  .pw-meter li.ok { color: #4e8b57; }
  .pw-meter li::before { content: '○ '; }
  .pw-meter li.ok::before { content: '✓ '; }
</style>
<script>
(function () {
  var MIN = 8, STRONG = 12;
  var COMMON = ['12345678','123456789','1234567890','87654321','11111111','00000000','88888888',
    '66666666','12341234','11223344','123123123','147258369','password','password1','password123',
    'passw0rd','p@ssw0rd','p@ssword','qwertyui','qwerty123','qwertyuiop','1qaz2wsx','qazwsxedc',
    '1q2w3e4r','asdfghjk','zxcvbnm1','iloveyou','abcd1234','abc12345','aa123456','admin123',
    'administrator','welcome1','letmein1','sunshine','princess','football','baseball','superman',
    'trustno1','whatever','dragon12','snaptolearn','jlens123','teacher123','student123','guest123'];
  var SEQ = ['01234567890123456789','abcdefghijklmnopqrstuvwxyz','qwertyuiopasdfghjklzxcvbnm',
    'qwertyuiop','asdfghjkl','zxcvbnm','1qaz2wsx3edc4rfv5tgb','qazwsxedcrfvtgb'];
  var COLORS = { too_short: '#e57373', weak: '#ef8a3c', medium: '#e2b33b', strong: '#4e8b57' };
  var LABELS = { too_short: '太短', weak: '弱', medium: '中', strong: '強' };
  var ORDER = ['too_short', 'weak', 'medium', 'strong'];

  function kinds(pw) {
    return (/[a-z]/.test(pw) ? 1 : 0) + (/[A-Z]/.test(pw) ? 1 : 0) +
           (/[0-9]/.test(pw) ? 1 : 0) + (/[^a-zA-Z0-9]/.test(pw) ? 1 : 0);
  }
  function isSeq(pw) {
    var s = pw.toLowerCase();
    if (new Set(s.split('')).size <= 2) return true;
    return SEQ.some(function (q) {
      return q.indexOf(s) >= 0 || q.split('').reverse().join('').indexOf(s) >= 0;
    });
  }
  function evaluate(pw, account) {
    var key = (account || '').split('@')[0].trim().toLowerCase();
    if (key.length < 3) key = '';
    var lower = pw.toLowerCase(), k = kinds(pw);
    var common = COMMON.indexOf(lower) >= 0, seq = pw.length > 0 && isSeq(pw);
    var hasAcc = !!key && lower.indexOf(key) >= 0;
    var level = pw.length < MIN ? 'too_short'
      : (common || seq || hasAcc || k < 2) ? 'weak'
      : (pw.length >= STRONG && k >= 3) ? 'strong' : 'medium';
    return { level: level, checks: [
      ['至少 ' + MIN + ' 個字元', pw.length >= MIN],
      ['包含兩種以上字元（大寫、小寫、數字、符號）', k >= 2],
      ['不是常見密碼或連續字元', pw.length > 0 && !(common || seq)],
      ['不包含帳號名稱', !hasAcc],
      [STRONG + ' 個字元以上更安全', pw.length >= STRONG]
    ]};
  }

  function attach(input) {
    var form = input.form;
    var accountInput = form && (form.querySelector('[name="username"]') || form.querySelector('[name="email"]'));
    var fixedAccount = input.getAttribute('data-account') || '';
    var box = document.createElement('div');
    box.className = 'pw-meter';
    input.insertAdjacentElement('afterend', box);

    function render() {
      var pw = input.value;
      if (!pw) { box.innerHTML = ''; return; }
      var r = evaluate(pw, accountInput ? accountInput.value : fixedAccount);
      var filled = ORDER.indexOf(r.level) + 1, color = COLORS[r.level], html = '<div class="pw-bars">';
      for (var i = 0; i < 4; i++) html += '<div class="pw-bar" style="background:' + (i < filled ? color : '#e9ecef') + '"></div>';
      html += '<span class="pw-label" style="color:' + color + '">強度：' + LABELS[r.level] + '</span></div>';
      if (r.level === 'too_short') html += '<div class="pw-warn">密碼至少需要 ' + MIN + ' 個字元</div>';
      else if (r.level === 'weak') html += '<div class="pw-warn">後台帳號的密碼強度至少需要「中」</div>';
      html += '<ul>' + r.checks.map(function (c) {
        return '<li class="' + (c[1] ? 'ok' : '') + '">' + c[0] + '</li>';
      }).join('') + '</ul>';
      box.innerHTML = html;
    }
    input.addEventListener('input', render);
    if (accountInput) accountInput.addEventListener('input', render);
  }

  document.querySelectorAll('input[name="new_password"], input[name="password"]').forEach(attach);
})();
</script>
