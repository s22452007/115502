<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>JLens 校園教育版 - 修改密碼</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        html { scrollbar-gutter: stable; }
        :root {
            --green-dark: #4a7a54;
            --green-mid: #6a9e72;
            --green-light: #dce7de;
            --green-accent: #5c8364;
            --bg: #f4f7f5;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); font-family: "微軟正黑體", sans-serif; color: #333; margin: 0; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 220px; background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.04); padding: 24px 0; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu a { display: flex; align-items: center; gap: 10px; padding: 12px 20px; color: #666; text-decoration: none; font-size: 0.95rem; transition: 0.2s; }
        .sidebar-menu a:hover { background: var(--bg); color: var(--green-accent); }
        .sidebar-menu a.active { background: var(--green-light); color: var(--green-accent); font-weight: bold; border-right: 4px solid var(--green-accent); }
        .sidebar-menu a i { color: var(--green-accent); font-size: 1.1rem; width: 20px; text-align: center; }
        .sidebar-admin { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid #eee; margin-bottom: 8px; }
        .sidebar-admin-avatar { width: 34px; height: 34px; background: var(--green-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: var(--green-accent); flex-shrink: 0; }
        .sidebar-admin-info .name { font-size: 0.88rem; font-weight: bold; color: #333; }
        .sidebar-admin-info .role { font-size: 0.72rem; color: #aaa; margin-top: 1px; }

        .main-content { flex: 1; padding: 32px 48px; overflow-x: hidden; }
        .page-title { color: var(--green-dark); font-weight: 900; margin: 0; font-size: 1.6rem; }
        .page-sub { font-size: 0.85rem; color: #888; margin-top: 4px; }
        .pw-box { max-width: 460px; margin-top: 24px; background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); padding: 28px 30px; }
        .pw-box .form-label { font-weight: 700; font-size: 0.9rem; }
        .pw-btn { background-color: var(--green-accent); border: none; color: white; font-weight: 700; border-radius: 10px; }
        .pw-btn:hover { background-color: var(--green-dark); color: white; }
        .msg { max-width: 460px; border-radius: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="layout">
    {% include 'teacher/_sidebar.html' %}

    <main class="main-content">
        <h1 class="page-title"><i class="bi bi-key-fill me-2"></i>修改密碼</h1>
        <div class="page-sub">登入帳號：<strong>{{ teacher.email }}</strong>，更新後下次登入請使用新密碼</div>

        {% if error %}
        <div class="alert alert-danger msg mt-3"><i class="bi bi-x-circle-fill me-1"></i>{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="alert alert-success msg mt-3"><i class="bi bi-check-circle-fill me-1"></i>{{ success }}</div>
        {% endif %}

        <div class="pw-box">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">目前密碼</label>
                    <input type="password" name="current_password" class="form-control" required autocomplete="current-password">
                </div>
                <div class="mb-3">
                    <label class="form-label">新密碼</label>
                    <input type="password" name="new_password" class="form-control" required minlength="6" placeholder="至少 6 個字元" autocomplete="new-password">
                </div>
                <div class="mb-4">
                    <label class="form-label">確認新密碼</label>
                    <input type="password" name="confirm_password" class="form-control" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="btn w-100 py-2 pw-btn">更新密碼</button>
            </form>
            <div class="small text-muted mt-3" style="line-height: 1.7;">
                <i class="bi bi-google me-1"></i>用學校 Google 帳號登入的老師不需要密碼，這裡不用設定。<br>
                <i class="bi bi-question-circle me-1"></i>忘記目前密碼請聯繫系統管理員重設。
            </div>
        </div>
    </main>
</div>
</body>
</html>
