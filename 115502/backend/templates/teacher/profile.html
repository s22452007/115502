<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>JLens 校園教育版 - 個人資料</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        html { scrollbar-gutter: stable; }
        :root {
            --green-dark: #4a7a54;
            --green-mid: #6a9e72;
            --green-light: #dce7de;
            --green-accent: #5c8364;
            --bg: #f4f7f5;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); font-family: "微軟正黑體", sans-serif; color: #333; margin: 0; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 220px; background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.04); padding: 24px 0; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu a { display: flex; align-items: center; gap: 10px; padding: 12px 20px; color: #666; text-decoration: none; font-size: 0.95rem; transition: 0.2s; }
        .sidebar-menu a:hover { background: var(--bg); color: var(--green-accent); }
        .sidebar-menu a.active { background: var(--green-light); color: var(--green-accent); font-weight: bold; border-right: 4px solid var(--green-accent); }
        .sidebar-menu a i { color: var(--green-accent); font-size: 1.1rem; width: 20px; text-align: center; }
        .sidebar-admin { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid #eee; margin-bottom: 8px; }
        .sidebar-admin-avatar { width: 34px; height: 34px; background: var(--green-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: var(--green-accent); flex-shrink: 0; }
        .sidebar-admin-info .name { font-size: 0.88rem; font-weight: bold; color: #333; }
        .sidebar-admin-info .role { font-size: 0.72rem; color: #aaa; margin-top: 1px; }

        .main-content { flex: 1; padding: 32px 48px; overflow-x: hidden; }
        .page-title { color: var(--green-dark); font-weight: 900; margin: 0; font-size: 1.6rem; }
        .page-sub { font-size: 0.85rem; color: #888; margin-top: 4px; }
        .pf-box { max-width: 460px; margin-top: 24px; background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); padding: 28px 30px; }
        .pf-box .form-label { font-weight: 700; font-size: 0.9rem; }
        .pf-btn { background-color: var(--green-accent); border: none; color: white; font-weight: 700; border-radius: 10px; }
        .pf-btn:hover { background-color: var(--green-dark); color: white; }
        .msg { max-width: 460px; border-radius: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="layout">
    {% include 'teacher/_sidebar.html' %}

    <main class="main-content">
        <h1 class="page-title"><i class="bi bi-person-fill me-2"></i>個人資料</h1>
        <div class="page-sub">學生在 App 教室頁看到的「老師：XXX」就是這裡的顯示名稱</div>

        {% if error %}
        <div class="alert alert-danger msg mt-3"><i class="bi bi-x-circle-fill me-1"></i>{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="alert alert-success msg mt-3"><i class="bi bi-check-circle-fill me-1"></i>{{ success }}</div>
        {% endif %}

        <div class="pf-box">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">顯示名稱</label>
                    <input type="text" name="username" class="form-control" value="{{ name_value }}" required maxlength="30" placeholder="例：王小明老師">
                    <div class="form-text">最多 30 個字。名稱不能和系統裡其他人重複，撞名時可以加上全名或科目。</div>
                </div>
                <div class="mb-4">
                    <label class="form-label">登入 Email</label>
                    <input type="text" class="form-control bg-light" value="{{ teacher.email }}" disabled>
                    <div class="form-text">登入用的帳號，不能修改；改名稱不會影響登入和班級資料。</div>
                </div>
                <button type="submit" class="btn w-100 py-2 pf-btn">儲存</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
