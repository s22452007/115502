<!-- 密碼欄位：左邊鎖頭、右邊眼睛可以切換顯示／隱藏，樣式跟 App 的密碼欄一致。
     自動套用到頁面上所有 type="password" 的欄位；已經自己有眼睛按鈕的（放在 .input-group 裡）不重複加。
     要放在 _password_strength.html 之前或之後都可以。 -->
<style>
  .pw-field { position: relative; }
  .pw-field > input.form-control {
    background: #f3f5f4;
    border: 1px solid transparent;
    border-radius: 14px;
    padding-left: 44px;
    padding-right: 48px;
    box-shadow: none;
  }
  .pw-field > input.form-control:focus {
    background: #fff;
    border-color: #5c8663;
    box-shadow: 0 0 0 3px rgba(92, 134, 99, 0.15);
  }
  .pw-field .pw-lock {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: #4e8b57; font-size: 1.1rem; pointer-events: none;
  }
  .pw-field .pw-eye {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    border: none; background: transparent; color: #9aa59c;
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 1.15rem;
  }
  .pw-field .pw-eye:hover { background: rgba(0, 0, 0, 0.05); color: #5c8663; }
</style>
<script>
(function () {
  function enhance(input) {
    if (input.dataset.pwToggle || input.closest('.input-group') || input.closest('.pw-field')) return;
    input.dataset.pwToggle = '1';

    var wrap = document.createElement('div');
    wrap.className = 'pw-field';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);

    var lock = document.createElement('i');
    lock.className = 'bi bi-lock pw-lock';
    wrap.insertBefore(lock, input);

    var eye = document.createElement('button');
    eye.type = 'button';
    eye.className = 'pw-eye';
    eye.setAttribute('aria-label', '顯示密碼');
    eye.innerHTML = '<i class="bi bi-eye"></i>';
    eye.addEventListener('click', function () {
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      eye.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
      eye.setAttribute('aria-label', show ? '隱藏密碼' : '顯示密碼');
    });
    wrap.appendChild(eye);
  }

  function run() {
    document.querySelectorAll('input[type="password"]').forEach(enhance);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();
</script>
