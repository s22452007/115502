<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>JLens 等待審核</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f4f7f5; font-family: "微軟正黑體", sans-serif; color: #444; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-box { background: white; border-radius: 20px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); padding: 44px 48px; max-width: 520px; width: 100%; text-align: center; }
        .icon { width: 72px; height: 72px; border-radius: 50%; background: #fff3cd; color: #b8860b; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 20px; }
        h3 { font-weight: 800; color: #333; margin-bottom: 10px; }
        .who { color: #5c8364; font-weight: 700; margin-bottom: 18px; }
        p { color: #777; line-height: 1.8; font-size: 0.95rem; }
        .btn-out { border-radius: 10px; padding: 10px 22px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="card-box">
        <div class="icon"><i class="bi bi-hourglass-split"></i></div>
        <h3>老師帳號等待審核中</h3>
        <div class="who">{{ teacher.username }} · {{ teacher.email }}</div>
        <p>
            你的學校帳號已完成驗證，但老師身分需要由學校系統管理員確認後才能使用班級功能。<br>
            審核通過後，重新登入即可建立班級並取得學生加入隨機碼。
        </p>
        <p class="small text-muted">如果等待太久，請聯繫學校的系統管理員協助審核。</p>
        <a href="{{ url_for('admin_logout') }}" class="btn btn-outline-secondary btn-out mt-2"><i class="bi bi-box-arrow-right me-1"></i> 登出</a>
    </div>
</body>
</html>
